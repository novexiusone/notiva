# git-cliff writes CHANGELOG.md in the Keep a Changelog format.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}\
          {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}

"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/novexlab/notiva/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/novexlab/notiva/releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/novexlab/notiva/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments fix the order of the groups and are stripped by the template.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
    { message = "^revert", group = "<!-- 1 -->Changed" },
    { message = "^fix\\(security\\)", group = "<!-- 4 -->Security" },
    { message = "^fix", group = "<!-- 3 -->Fixed" },
    { message = "^(docs|style|test|build|ci|chore)", skip = true },
]
# Breaking changes are kept even when their type is skipped above.
protect_breaking_commits = true
