[package]
name = "notiva"
version = "0.0.0"
description = "Local-first Notion alternative for macOS"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "notiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "4", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Optimised like a release build, but without the slow link-time optimisation.
[profile.benchmark]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false
