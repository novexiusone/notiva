[package]
name = "notiva"
version = "0.0.0"
description = "Local-first Notion alternative for macOS"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "notiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
