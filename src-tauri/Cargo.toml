[package]
name = "notiva"
version = "0.0.0"
description = "Local-first notes and databases for macOS, Windows and Linux"
license = "Apache-2.0"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "notiva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "4", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
# Backups: archive, checksums, compression, passphrase encryption.
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
argon2 = "0.5"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"
libc = "0.2"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimised like a release build, but without the slow link-time optimisation.
[profile.benchmark]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
strip = false
