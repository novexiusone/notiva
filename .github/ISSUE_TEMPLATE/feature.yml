name: Feature
description: New functionality that should be built
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: goal
    attributes:
      label: What should be possible?
      description: Describe it from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Criteria that can be checked.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Affected module, dependencies, sketches.
