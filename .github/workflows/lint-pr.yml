name: lint-pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: The subject must start lowercase and must not end with a period.

  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name against Conventional Branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^((feat|fix|hotfix|release|chore)/[a-z0-9]+([.-][a-z0-9]+)*|release-please--.+)$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch name ok: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' does not match type/short-description (feat, fix, hotfix, release, chore; lowercase letters, digits, hyphens, dots)."
            exit 1
          fi

  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
