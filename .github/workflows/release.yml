name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Create the release app token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.release-app.outputs.token || github.token }}

      # release-please computes the version and keeps the release pull request
      # up to date. The changelog is written by git-cliff into that pull request.
      - name: Check out the release pull request
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token || github.token }}

      - name: Read the next version
        if: steps.release.outputs.pr
        id: version
        run: echo "version=$(jq -r '."."' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Write the changelog
        if: steps.release.outputs.pr
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }} --output CHANGELOG.md

      - name: Commit the changelog
        if: steps.release.outputs.pr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update changelog"
          git push

      # GITHUB_TOKEN-created releases do not emit release events, so hand off
      # explicitly. workflow_dispatch is exempt from that recursion guard.
      - name: Start the bundle workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run bundle.yml --repo "$GITHUB_REPOSITORY" -f "tag_name=$TAG"
